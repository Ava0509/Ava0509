name: WakaTime Coding Stats

on:
  schedule:
    # runs every 12 hours
    - cron: '0 */12 * * *'
  # manual trigger
  workflow_dispatch: 

jobs:
  update-readme:
    name: Update Readme with WakaTime Metrics
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          SHOW_TOTAL: "true" # show total coding time
          TIME_RANGE: "all_time"
